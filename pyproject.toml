[project]
name = "agent-keeper-mcp"
version = "1.0.0"
description = "Autonomous Onchain Agent Gateway & MCP Protocol Suite for KeeperHub"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp<2",
    "pydantic>=2.0",
    "httpx>=0.28.0",
    "eth-account>=0.13.0",
    "python-dotenv>=1.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
ignore = ["BLE001"]

[dependency-groups]
dev = [
    "hypothesis>=6.167.1",
]
