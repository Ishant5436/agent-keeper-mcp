[project]
name = "agent-keeper-mcp"
version = "1.0.0"
description = "Autonomous Onchain Agent Gateway & MCP Protocol Suite for KeeperHub"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp<2",
    "pydantic>=2.0",
    "httpx>=0.28.0",
    "eth-account>=0.13.0",
    "python-dotenv>=1.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["no_verifier_env: run without ARC_X402_VERIFIER set"]

[tool.ruff.lint]
ignore = ["BLE001"]

[project.optional-dependencies]
# Contract tests only: in-memory EVM + solc downloader. Not needed at runtime.
contracts = [
    "web3[tester]>=7.0.0",
    "py-solc-x>=2.0.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.167.1",
    "web3[tester]>=7.0.0",
    "py-solc-x>=2.0.0",
]
